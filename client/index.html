<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Protocol City</title>

    <style>
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #05070d;
        color: #e5e7eb;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 7, 18, 0.8);
        z-index: 10;
      }

      .panel {
        width: 320px;
        padding: 24px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      input {
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #020617;
        color: white;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        background: #0ea5e9;
        color: white;
      }

      #register-btn {
        background: #22c55e;
      }

      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 5;
        width: 360px;
        pointer-events: none;
      }

      #log {
        max-height: 240px;
        overflow: auto;
        font-size: 13px;
        background: rgba(2, 6, 23, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 8px;
      }

      #controls {
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.85;
        line-height: 1.5;
      }

      #seated-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        border-radius: 20px;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        font-size: 14px;
        color: #facc15;
        z-index: 6;
      }

      #cafeteria-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        border-radius: 20px;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        font-size: 14px;
        color: #4ade80;
        z-index: 6;
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <div class="panel">
        <h2>Протокол-Сити</h2>

        <input id="username" placeholder="Имя пользователя" />
        <input id="password" type="password" placeholder="Пароль" />

        <button id="login-btn">Войти</button>
        <button id="register-btn">Регистрация</button>

        <div id="status" style="margin-top: 10px; font-size: 13px"></div>
      </div>
    </div>

    <div id="hud" hidden>
      <div id="log"></div>
      <div id="controls">
        <strong>WASD</strong> — движение<br />
        <strong>Space</strong> — прыжок<br />
        <strong>E</strong> — взаимодействие (терминал / сесть на стул)<br />
        <strong>N</strong> — спросить НПС<br />
        <strong>F</strong> — спуск в кофетерий / подъём обратно<br />
        <span style="opacity:0.6">Кликните по экрану, чтобы захватить мышь</span>
      </div>
    </div>

    <div id="seated-hint" hidden>Вы сидите. Нажмите <strong>E</strong>, чтобы встать</div>
    <div id="cafeteria-hint" hidden>Нажмите <strong>F</strong>, чтобы спуститься в кофетерий</div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
